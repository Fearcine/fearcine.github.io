<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kettletoro.shop — Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #F5EDE3;
      --bg-dot: rgba(20, 20, 20, .09);
      --paper: #FFFDF7;
      --ink: #141414;
      --muted: #4A4458;
      --pink: #FF8FAB;
      --pink-soft: #FFD6E3;
      --pink-deep: #C42B5E;
      --yellow: #FFE45E;
      --mint: #A8F0D1;
      --sky: #B8D0FF;
      --lavender: #E2CFFF;
      --border: 3px solid var(--ink);
      --shadow-lg: 8px 8px 0 var(--ink);
      --shadow-md: 5px 5px 0 var(--ink);
      --shadow-sm: 3px 3px 0 var(--ink);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      background-image: radial-gradient(var(--bg-dot) 1.3px, transparent 1.3px);
      background-size: 22px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 1.25rem;
    }

    h1,
    h2,
    .brand {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      margin: 0;
      letter-spacing: -.03em;
    }

    .tape {
      position: absolute;
      width: 110px;
      height: 26px;
      background-color: rgba(255, 228, 94, .88);
      background-image: repeating-linear-gradient(-45deg, transparent, transparent 6px, rgba(20, 20, 20, .08) 6px, rgba(20, 20, 20, .08) 12px);
      border: 2px solid rgba(20, 20, 20, .78);
      pointer-events: none;
      z-index: 4;
    }

    .tape.pink {
      background-color: rgba(255, 143, 171, .85);
    }

    .tape.mint {
      background-color: rgba(168, 240, 209, .88);
    }

    .tape.sky {
      background-color: rgba(184, 208, 255, .88);
    }


    .layer-wrap {
      position: relative;
      z-index: 1;
    }

    .layer-back {
      position: absolute;
      inset: 0;
      border: var(--border);
      pointer-events: none;
      z-index: 1;
    }


    .card-outer {
      width: 100%;
      max-width: 560px;
      animation: floatIn .7s var(--ease) both;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(30px) rotate(-2deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) rotate(-0.5deg);
      }
    }

    .card-back-pink {
      background: var(--pink);
      border-radius: 22px;
      transform: rotate(-1.8deg) translate(-6px, 8px);
      z-index: 0;
    }

    .card-back-mint {
      background: var(--mint);
      border-radius: 22px;
      transform: rotate(1.4deg) translate(8px, 10px);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      background: var(--paper);
      border: var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow-lg);
      padding: clamp(2rem, 5vw, 3rem);
      text-align: center;
    }

    .card-tape-l {
      top: -13px;
      left: 28px;
      transform: rotate(-8deg);
    }

    .card-tape-r {
      top: -13px;
      right: 28px;
      transform: rotate(6deg);
    }

    .char-wrap {
      width: clamp(120px, 22vw, 180px);
      margin: 0 auto 1rem;
      animation: bounce 2.5s var(--ease) infinite;
    }

    .char-wrap img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(3px 3px 0 var(--ink));
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: var(--yellow);
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      padding: .35rem .9rem;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .04em;
      box-shadow: var(--shadow-sm);
      transform: rotate(-2deg);
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }

    .card h1 {
      font-size: clamp(1.6rem, 4.5vw, 2.4rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: .8rem;
    }

    .card .subtitle {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
      max-width: 38ch;
      margin: 0 auto .5rem;
      line-height: 1.5;
    }

    .speech {
      display: inline-block;
      background: var(--pink-soft);
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: .7rem 1.1rem;
      box-shadow: var(--shadow-sm);
      transform: rotate(1deg);
      margin: 1.2rem auto .2rem;
      max-width: 340px;
      font-family: "Caveat", cursive;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--pink-deep);
    }

    .divider {
      border: none;
      border-top: 2.5px dashed rgba(20, 20, 20, .25);
      margin: 1.4rem 0;
    }

    .twitch-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      background: var(--pink);
      color: var(--ink);
      font-size: .9rem;
      font-weight: 700;
      text-decoration: none;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      padding: .65rem 1.3rem;
      box-shadow: var(--shadow-sm);
      transition: transform 160ms var(--ease), box-shadow 160ms var(--ease), background 160ms var(--ease);
    }

    .twitch-link:hover {
      background: #FF789B;
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 var(--ink);
    }

    .twitch-link:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .footer-note {
      margin-top: 1.2rem;
      font-size: .78rem;
      font-weight: 600;
      color: var(--muted);
    }

    .doodle {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }

    .doodle-1 {
      top: 8%;
      left: 5%;
      width: 50px;
      animation: spin 12s linear infinite;
    }

    .doodle-2 {
      bottom: 10%;
      right: 6%;
      width: 45px;
      animation: spin 15s linear infinite reverse;
    }

    .doodle-3 {
      top: 15%;
      right: 10%;
      width: 38px;
      animation: float 4s var(--ease) infinite;
    }

    .doodle-4 {
      bottom: 18%;
      left: 8%;
      width: 42px;
      animation: float 5s var(--ease) infinite .5s;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <svg class="doodle doodle-1" viewBox="0 0 64 64" fill="none">
    <path d="M32 4L39.5 23.5L60 25L44.5 38.5L49 59L32 48L15 59L19.5 38.5L4 25L24.5 23.5L32 4Z" fill="#FFE45E"
      stroke="#141414" stroke-width="3" stroke-linejoin="round" />
  </svg>
  <svg class="doodle doodle-2" viewBox="0 0 64 64" fill="none">
    <path
      d="M32 55C32 55 8 40.5 8 22.5C8 14.5 14.2 8.5 21.8 8.5C26.6 8.5 30.3 11 32 14.2C33.7 11 37.4 8.5 42.2 8.5C49.8 8.5 56 14.5 56 22.5C56 40.5 32 55 32 55Z"
      fill="#FF8FAB" stroke="#141414" stroke-width="3" stroke-linejoin="round" />
  </svg>
  <svg class="doodle doodle-3" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="26" fill="#A8F0D1" stroke="#141414" stroke-width="3" />
  </svg>
  <svg class="doodle doodle-4" viewBox="0 0 64 64" fill="none">
    <rect x="10" y="10" width="44" height="44" rx="8" fill="#B8D0FF" stroke="#141414" stroke-width="3"
      transform="rotate(12 32 32)" />
  </svg>
  <div class="card-outer">
    <div class="layer-wrap">
      <div class="layer-back card-back-mint" aria-hidden="true"></div>
      <div class="layer-back card-back-pink" aria-hidden="true"></div>
      <div class="card">
        <div class="tape pink card-tape-l" aria-hidden="true"></div>
        <div class="tape mint card-tape-r" aria-hidden="true"></div>

        <div class="char-wrap">
          <img src="profile_charecter_png.png" alt="kettletoro character" />
        </div>

        <div class="badge">Under Maintenance !!</div>

        <hr class="divider" />

        <a href="https://twitch.tv/kettletoro" target="_blank" rel="noopener noreferrer" class="twitch-link">
          Watch her on Twitch while you wait ↗
        </a>

        <p class="footer-note">
          Fan-made page · Nothing is for sale · No data stored
        </p>
      </div>
    </div>
  </div>

</body>

</html>
